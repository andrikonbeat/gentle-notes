<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <!-- Background -->
  <rect width="1280" height="640" fill="#0d1117"/>
  
  <!-- Subtle grid pattern -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1f2937" stroke-width="0.5"/>
    </pattern>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1b4b;stop-opacity:0.3"/>
      <stop offset="50%" style="stop-color:#0d1117;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#14532d;stop-opacity:0.2"/>
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f472b6"/>
      <stop offset="50%" style="stop-color:#a78bfa"/>
      <stop offset="100%" style="stop-color:#60a5fa"/>
    </linearGradient>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f472b6"/>
      <stop offset="100%" style="stop-color:#60a5fa"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1280" height="640" fill="url(#bgGradient)"/>
  <rect width="1280" height="640" fill="url(#grid)"/>
  
  <!-- Top accent bar -->
  <rect x="0" y="0" width="1280" height="4" fill="url(#accentGradient)"/>
  
  <!-- Left side: Terminal mockup -->
  <g transform="translate(80, 120)">
    <!-- Terminal window -->
    <rect x="0" y="0" width="520" height="400" rx="8" fill="#0a0e14" stroke="#1f2937" stroke-width="1"/>
    
    <!-- Title bar -->
    <rect x="0" y="0" width="520" height="36" rx="8" fill="#161b22"/>
    <rect x="0" y="32" width="520" height="4" fill="#161b22"/>
    
    <!-- Traffic lights -->
    <circle cx="16" cy="18" r="6" fill="#ff5f57"/>
    <circle cx="36" cy="18" r="6" fill="#ffbd2e"/>
    <circle cx="56" cy="18" r="6" fill="#28ca42"/>
    
    <!-- Terminal title -->
    <text x="90" y="23" font-family="'JetBrains Mono', monospace" font-size="12" fill="#8b949e">gentle-notes@main</text>
    
    <!-- Terminal content -->
    <g transform="translate(20, 60)">
      <!-- Prompt lines -->
      <text x="0" y="0" font-family="'JetBrains Mono', monospace" font-size="13" fill="#60a5fa">▶</text>
      <text x="20" y="0" font-family="'JetBrains Mono', monospace" font-size="13" fill="#9ca3af">gentle-notes</text>
      <text x="150" y="0" font-family="'JetBrains Mono', monospace" font-size="13" fill="#f472b6">✎</text>
      <text x="170" y="0" font-family="'JetBrains Mono', monospace" font-size="13" fill="#6ee7b7">~</text>
      
      <!-- Notes list -->
      <text x="0" y="35" font-family="'JetBrains Mono', monospace" font-size="13" fill="#6b7280">┌─ Notes ─────────────────────────────────────┐</text>
      
      <!-- Note 1 (pending) -->
      <text x="0" y="60" font-family="'JetBrains Mono', monospace" font-size="13" fill="#f472b6">✉</text>
      <text x="20" y="60" font-family="'JetBrains Mono', monospace" font-size="13" fill="#e5e7eb">Ask about migration ordering</text>
      <text x="460" y="60" font-family="'JetBrains Mono', monospace" font-size="13" fill="#f472b6">➤</text>
      
      <!-- Note 2 (pending) -->
      <text x="0" y="85" font-family="'JetBrains Mono', monospace" font-size="13" fill="#f472b6">✉</text>
      <text x="20" y="85" font-family="'JetBrains Mono', monospace" font-size="13" fill="#e5e7eb">The flaky test is probably the fixture</text>
      <text x="460" y="85" font-family="'JetBrains Mono', monospace" font-size="13" fill="#f472b6">➤</text>
      
      <!-- Note 3 (sent) -->
      <text x="0" y="110" font-family="'JetBrains Mono', monospace" font-size="13" fill="#6ee7b7">✓</text>
      <text x="20" y="110" font-family="'JetBrains Mono', monospace" font-size="13" fill="#6b7280" style="text-decoration: line-through;">Check release notes before deploy</text>
      <text x="460" y="110" font-family="'JetBrains Mono', monospace" font-size="13" fill="#6ee7b7">↶</text>
      <text x="480" y="110" font-family="'JetBrains Mono', monospace" font-size="13" fill="#f87171">×</text>
      
      <!-- Note 4 (pending) -->
      <text x="0" y="135" font-family="'JetBrains Mono', monospace" font-size="13" fill="#f472b6">✉</text>
      <text x="20" y="135" font-family="'JetBrains Mono', monospace" font-size="13" fill="#e5e7eb">Refactor auth middleware</text>
      <text x="460" y="135" font-family="'JetBrains Mono', monospace" font-size="13" fill="#f472b6">➤</text>
      
      <!-- Note 5 (pending, folded) -->
      <text x="0" y="160" font-family="'JetBrains Mono', monospace" font-size="13" fill="#f472b6">✉</text>
      <text x="20" y="160" font-family="'JetBrains Mono', monospace" font-size="13" fill="#e5e7eb">Update dependencies...</text>
      <text x="280" y="160" font-family="'JetBrains Mono', monospace" font-size="13" fill="#6b7280">…</text>
      <text x="460" y="160" font-family="'JetBrains Mono', monospace" font-size="13" fill="#f472b6">➤</text>
      
      <!-- Sent section -->
      <text x="0" y="195" font-family="'JetBrains Mono', monospace" font-size="13" fill="#6b7280">├─ 2 sent  ▾ Collapse  Delete All ────────────┤</text>
      
      <!-- Sent note 1 -->
      <text x="0" y="220" font-family="'JetBrains Mono', monospace" font-size="13" fill="#6ee7b7">✓</text>
      <text x="20" y="220" font-family="'JetBrains Mono', monospace" font-size="13" fill="#6b7280" style="text-decoration: line-through;">Fix typecheck errors in storage.ts</text>
      <text x="460" y="220" font-family="'JetBrains Mono', monospace" font-size="13" fill="#6ee7b7">↶</text>
      <text x="480" y="220" font-family="'JetBrains Mono', monospace" font-size="13" fill="#f87171">×</text>
      
      <!-- Sent note 2 -->
      <text x="0" y="245" font-family="'JetBrains Mono', monospace" font-size="13" fill="#6ee7b7">✓</text>
      <text x="20" y="245" font-family="'JetBrains Mono', monospace" font-size="13" fill="#6b7280" style="text-decoration: line-through;">Add card-parity tests</text>
      <text x="460" y="245" font-family="'JetBrains Mono', monospace" font-size="13" fill="#6ee7b7">↶</text>
      <text x="480" y="245" font-family="'JetBrains Mono', monospace" font-size="13" fill="#f87171">×</text>
      
      <!-- Input field -->
      <text x="0" y="290" font-family="'JetBrains Mono', monospace" font-size="13" fill="#6b7280">└─ Input ─────────────────────────────────────┘</text>
      <rect x="0" y="305" width="480" height="60" rx="4" fill="#0d1117" stroke="#374151" stroke-width="1"/>
      <text x="15" y="338" font-family="'JetBrains Mono', monospace" font-size="13" fill="#6b7280">＋ Write a note…</text>
      <text x="15" y="355" font-family="'JetBrains Mono', monospace" font-size="11" fill="#6b7280">Enter to save • Esc to return to chat</text>
    </g>
  </g>
  
  <!-- Right side: Features -->
  <g transform="translate(660, 120)">
    <!-- Logo/Name -->
    <g transform="translate(250, 0)">
      <!-- Pencil icon -->
      <g transform="translate(-30, -8)">
        <path d="M12 2L2 12l3 3 10-10-3-3z" fill="none" stroke="url(#accentGradient)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
        <path d="M18 8l-4 4" stroke="url(#accentGradient)" stroke-width="3" stroke-linecap="round" filter="url(#glow)"/>
        <path d="M8 18l4-4" stroke="url(#accentGradient)" stroke-width="3" stroke-linecap="round" filter="url(#glow)"/>
      </g>
      <text x="0" y="20" font-family="'JetBrains Mono', monospace" font-size="36" fill="url(#textGradient)" font-weight="700" text-anchor="middle" filter="url(#glow)">gentle-notes</text>
      <text x="0" y="60" font-family="system-ui, sans-serif" font-size="16" fill="#9ca3af" text-anchor="middle">Persistent notepad for gentle-shell &amp; Pi</text>
    </g>
    
    <!-- Badges row -->
    <g transform="translate(0, 100)">
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="160" height="36" rx="6" fill="#1f2937" stroke="#374151"/>
        <text x="80" y="22" font-family="'JetBrains Mono', monospace" font-size="12" fill="#6ee7b7" text-anchor="middle" font-weight="600">259 tests</text>
      </g>
      <g transform="translate(180, 0)">
        <rect x="0" y="0" width="140" height="36" rx="6" fill="#1f2937" stroke="#374151"/>
        <text x="70" y="22" font-family="'JetBrains Mono', monospace" font-size="12" fill="#fbbf24" text-anchor="middle" font-weight="600">typecheck ✓</text>
      </g>
      <g transform="translate(340, 0)">
        <rect x="0" y="0" width="140" height="36" rx="6" fill="#1f2937" stroke="#374151"/>
        <text x="70" y="22" font-family="'JetBrains Mono', monospace" font-size="12" fill="#f472b6" text-anchor="middle" font-weight="600">card parity</text>
      </g>
      <g transform="translate(500, 0)">
        <rect x="0" y="0" width="100" height="36" rx="6" fill="#1f2937" stroke="#374151"/>
        <text x="50" y="22" font-family="'JetBrains Mono', monospace" font-size="12" fill="#a78bfa" text-anchor="middle" font-weight="600">MIT</text>
      </g>
    </g>
    
    <!-- Feature cards -->
    <g transform="translate(0, 160)">
      <!-- Feature 1 -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="280" height="110" rx="8" fill="#161b22" stroke="#21262d" stroke-width="1"/>
        <text x="20" y="30" font-family="'JetBrains Mono', monospace" font-size="14" fill="#f472b6">✎</text>
        <text x="55" y="30" font-family="system-ui, sans-serif" font-size="16" fill="#e5e7eb" font-weight="600">Inline capture</text>
        <text x="20" y="60" font-family="system-ui, sans-serif" font-size="13" fill="#8b949e">Click field → type → Enter. Text wraps naturally.</text>
        <text x="20" y="85" font-family="system-ui, sans-serif" font-size="13" fill="#8b949e">No modal, no context switch.</text>
      </g>
      
      <!-- Feature 2 -->
      <g transform="translate(320, 0)">
        <rect x="0" y="0" width="280" height="110" rx="8" fill="#161b22" stroke="#21262d" stroke-width="1"/>
        <text x="20" y="30" font-family="'JetBrains Mono', monospace" font-size="14" fill="#60a5fa">➤</text>
        <text x="55" y="30" font-family="system-ui, sans-serif" font-size="16" fill="#e5e7eb" font-weight="600">Deferred send</text>
        <text x="20" y="60" font-family="system-ui, sans-serif" font-size="13" fill="#8b949e">Send when ready. Busy agent? Queued as follow-up.</text>
        <text x="20" y="85" font-family="system-ui, sans-serif" font-size="13" fill="#8b949e">Never interrupts your turn.</text>
      </g>
      
      <!-- Feature 3 -->
      <g transform="translate(640, 0)">
        <rect x="0" y="0" width="280" height="110" rx="8" fill="#161b22" stroke="#21262d" stroke-width="1"/>
        <text x="20" y="30" font-family="'JetBrains Mono', monospace" font-size="14" fill="#6ee7b7">✓</text>
        <text x="55" y="30" font-family="system-ui, sans-serif" font-size="16" fill="#e5e7eb" font-weight="600">Sent history</text>
        <text x="20" y="60" font-family="system-ui, sans-serif" font-size="13" fill="#8b949e">Struck-through like done Todos. Restore (↶) or delete (×).</text>
        <text x="20" y="85" font-family="system-ui, sans-serif" font-size="13" fill="#8b949e">Restoring never re-sends.</text>
      </g>
    </g>
    
    <!-- Second row of features -->
    <g transform="translate(0, 290)">
      <!-- Feature 4 -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="280" height="110" rx="8" fill="#161b22" stroke="#21262d" stroke-width="1"/>
        <text x="20" y="30" font-family="'JetBrains Mono', monospace" font-size="14" fill="#a78bfa">▾</text>
        <text x="55" y="30" font-family="system-ui, sans-serif" font-size="16" fill="#e5e7eb" font-weight="600">Fold &amp; collapse</text>
        <text x="20" y="60" font-family="system-ui, sans-serif" font-size="13" fill="#8b949e">Block collapse + fold-all + per-note double-click.</text>
        <text x="20" y="85" font-family="system-ui, sans-serif" font-size="13" fill="#8b949e">Same grammar as Todos card.</text>
      </g>
      
      <!-- Feature 5 -->
      <g transform="translate(320, 0)">
        <rect x="0" y="0" width="280" height="110" rx="8" fill="#161b22" stroke="#21262d" stroke-width="1"/>
        <text x="20" y="30" font-family="'JetBrains Mono', monospace" font-size="14" fill="#fbbf24">⌨</text>
        <text x="55" y="30" font-family="system-ui, sans-serif" font-size="16" fill="#e5e7eb" font-weight="600">Keyboard-first</text>
        <text x="20" y="60" font-family="system-ui, sans-serif" font-size="13" fill="#8b949e">/note, /notes send, alt+n, alt+pgup/pgdn.</text>
        <text x="20" y="85" font-family="system-ui, sans-serif" font-size="13" fill="#8b949e">Everything works without a mouse.</text>
      </g>
      
      <!-- Feature 6 -->
      <g transform="translate(640, 0)">
        <rect x="0" y="0" width="280" height="110" rx="8" fill="#161b22" stroke="#21262d" stroke-width="1"/>
        <text x="20" y="30" font-family="'JetBrains Mono', monospace" font-size="14" fill="#f87171">🔒</text>
        <text x="55" y="30" font-family="system-ui, sans-serif" font-size="16" fill="#e5e7eb" font-weight="600">Safe storage</text>
        <text x="20" y="60" font-family="system-ui, sans-serif" font-size="13" fill="#8b949e">0700/0600 perms, corrupt stores preserved, sanitized input.</text>
        <text x="20" y="85" font-family="system-ui, sans-serif" font-size="13" fill="#8b949e">Watcher isolation, atomic writes.</text>
      </g>
    </g>
    
    <!-- Bottom: Install hint -->
    <g transform="translate(0, 430)">
      <rect x="0" y="0" width="960" height="80" rx="8" fill="#161b22" stroke="#374151" stroke-width="1"/>
      <text x="480" y="30" font-family="'JetBrains Mono', monospace" font-size="14" fill="#60a5fa" text-anchor="middle">Try it now</text>
      <text x="480" y="55" font-family="'JetBrains Mono', monospace" font-size="13" fill="#8b949e" text-anchor="middle"><code style="background:#0d1117;padding:2px 6px;border-radius:3px">pi --extension /path/to/gentle-notes</code>  or  <code style="background:#0d1117;padding:2px 6px;border-radius:3px">ln -s ... ~/.pi/agent/extensions/gentle-notes</code></text>
    </g>
  </g>
  
  <!-- Bottom accent bar -->
  <rect x="0" y="636" width="1280" height="4" fill="url(#accentGradient)"/>
  
  <!-- Corner accents -->
  <circle cx="30" cy="30" r="2" fill="#f472b6" opacity="0.4"/>
  <circle cx="1250" cy="30" r="2" fill="#60a5fa" opacity="0.4"/>
  <circle cx="30" cy="610" r="2" fill="#a78bfa" opacity="0.4"/>
  <circle cx="1250" cy="610" r="2" fill="#6ee7b7" opacity="0.4"/>
  
  <!-- Subtle watermark -->
  <text x="1200" y="620" font-family="'JetBrains Mono', monospace" font-size="10" fill="#1f2937" text-anchor="end">gentlemanprogramming.com</text>
</svg>