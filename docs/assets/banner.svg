<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 120" width="800" height="120">
  <!-- Background -->
  <rect width="800" height="120" fill="#0d1117"/>
  
  <!-- Subtle grid pattern -->
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1f2937" stroke-width="0.5"/>
    </pattern>
    <linearGradient id="glowGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f472b6;stop-opacity:0.15"/>
      <stop offset="50%" style="stop-color:#a78bfa;stop-opacity:0.1"/>
      <stop offset="100%" style="stop-color:#60a5fa;stop-opacity:0.15"/>
    </linearGradient>
  </defs>
  <rect width="800" height="120" fill="url(#grid)"/>
  
  <!-- Top accent line -->
  <line x1="0" y1="0" x2="800" y2="0" stroke="url(#glowGradient)" stroke-width="2"/>
  
  <!-- Left decoration -->
  <g transform="translate(40, 60)">
    <!-- Terminal prompt -->
    <text x="0" y="0" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="14" fill="#60a5fa" font-weight="500">▶</text>
    <text x="18" y="0" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="14" fill="#9ca3af">gentle-notes</text>
    <text x="120" y="0" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="14" fill="#f472b6">✎</text>
    <text x="140" y="0" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="14" fill="#6ee7b7">~</text>
  </g>
  
  <!-- Center: Logo/Name -->
  <g transform="translate(400, 55)">
    <!-- Pencil/note icon -->
    <g transform="translate(-60, -12)">
      <path d="M12 2L2 12l3 3 10-10-3-3z" fill="none" stroke="#f472b6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M18 8l-4 4" stroke="#f472b6" stroke-width="2" stroke-linecap="round"/>
      <path d="M8 18l4-4" stroke="#f472b6" stroke-width="2" stroke-linecap="round"/>
    </g>
    <text x="0" y="8" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="28" fill="#e5e7eb" font-weight="600" text-anchor="middle" letter-spacing="0.5">gentle-notes</text>
    <text x="0" y="32" font-family="system-ui, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Persistent notepad sidebar for gentle-shell & Pi</text>
  </g>
  
  <!-- Right: Status badges preview -->
  <g transform="translate(600, 60)">
    <rect x="0" y="-10" width="85" height="20" rx="3" fill="#1f2937" stroke="#374151"/>
    <text x="42.5" y="4" font-family="'JetBrains Mono', monospace" font-size="10" fill="#6ee7b7" text-anchor="middle" font-weight="500">v0.1.0</text>
    
    <rect x="95" y="-10" width="90" height="20" rx="3" fill="#1f2937" stroke="#374151"/>
    <text x="140" y="4" font-family="'JetBrains Mono', monospace" font-size="10" fill="#fbbf24" text-anchor="middle" font-weight="500">259 tests</text>
  </g>
  
  <!-- Bottom accent line -->
  <line x1="0" y1="120" x2="800" y2="120" stroke="url(#glowGradient)" stroke-width="1" opacity="0.5"/>
  
  <!-- Subtle corner accents -->
  <circle cx="20" cy="20" r="1" fill="#f472b6" opacity="0.3"/>
  <circle cx="780" cy="20" r="1" fill="#60a5fa" opacity="0.3"/>
  <circle cx="20" cy="100" r="1" fill="#a78bfa" opacity="0.3"/>
  <circle cx="780" cy="100" r="1" fill="#6ee7b7" opacity="0.3"/>
</svg>